00_intro:
  title: Intro
  description: In this intro module, you'll get an overview of what Ray is and how the course will help you scale Python applications with distributed computing. You'll also set up a reproducible local Ray + Jupyter development environment and verify your installation by running a simple Ray task.
  sources:
  - README.ipynb
  lessons:
    00_lesson:
      title: 'Introduction to Ray: Developer'
      description: Welcome to the Introduction to Ray course for developers. Get an overview of the course structure, hands-on examples, and how Ray helps you scale Python applications from single-machine development to production-ready distributed computing.
    01_lesson:
      title: Why Ray?
      description: Learn why Ray exists and how it helps you scale compute-intensive ML and Python workloads. Understand how Ray lets you run the same code from a laptop to a cluster without changing your application architecture.
    02_lesson:
      title: Setting Up a Local Ray Server using Jupyter Notebook
      description: Set up a reproducible local Ray development environment (Conda + UV + Jupyter) and verify your installation with a simple distributed “hello world” task.
  videoLessons:
    00_lesson: videos/01 Course Welcome.mp4
    01_lesson: videos/02 Why Ray.mp4
    02_lesson: videos/03 running locally.mp4
